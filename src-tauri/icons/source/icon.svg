<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Virus Vigil app icon: the same shield-with-heartbeat as the in-app avatar (main.js AVATAR),
       drawn on the app's night background with the neon cyan -> violet of the main buttons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="sh" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#27e1ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#27e1ff" stroke-opacity="0.35" stroke-width="6"/>
  <g transform="translate(512 520) scale(15.5) translate(-24 -24)" filter="url(#glow)">
    <path d="M24 3 41 9.5V22c0 10.6-7.1 19.3-17 23-9.9-3.7-17-12.4-17-23V9.5Z" fill="url(#sh)"/>
    <polyline points="9,25 17,25 20,18 24,32 28,14 31,25 39,25" fill="none" stroke="#031018" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
